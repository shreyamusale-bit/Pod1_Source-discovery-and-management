<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CyArt Source Registry</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222c;
    --border: #2a2f3a;
    --text: #e6e8ec;
    --muted: #8b93a3;
    --accent: #4f8cff;
    --green: #34c77b;
    --red: #ef5757;
    --amber: #e0a940;
    --gray: #6b7280;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
  }
  header {
    padding: 20px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  header h1 {
    font-size: 18px;
    margin: 0;
    font-weight: 600;
  }
  header p {
    margin: 2px 0 0;
    color: var(--muted);
    font-size: 12.5px;
  }
  .btn {
    background: var(--accent);
    color: white;
    border: none;
    padding: 9px 16px;
    border-radius: 6px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn:hover { filter: brightness(1.1); }
  .btn.secondary {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
  }
  .btn.danger { background: var(--red); }
  .btn.small { padding: 5px 10px; font-size: 12px; border-radius: 5px; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  main { padding: 20px 28px 60px; }

  .toolbar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 16px;
    align-items: center;
  }
  select, input {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 10px;
    border-radius: 6px;
    font-size: 13px;
  }
  select:focus, input:focus { outline: 1px solid var(--accent); }

  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  thead th {
    text-align: left;
    padding: 10px 12px;
    background: var(--panel-2);
    color: var(--muted);
    font-weight: 600;
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    border-bottom: 1px solid var(--border);
  }
  tbody td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #1a1e27; }

  .badge {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    text-transform: capitalize;
    white-space: nowrap;
  }
  .badge.discovered { background: #2a2f3a; color: var(--muted); }
  .badge.validated  { background: #22344a; color: #6ea8ff; }
  .badge.authorized { background: #2a3a2a; color: #7fd99a; }
  .badge.active     { background: #143a24; color: var(--green); }
  .badge.quarantined{ background: #3a2e14; color: var(--amber); }
  .badge.disabled   { background: #3a1616; color: var(--red); }

  .badge.pending  { background: #3a2e14; color: var(--amber); }
  .badge.approved { background: #143a24; color: var(--green); }
  .badge.rejected { background: #3a1616; color: var(--red); }
  .badge.expired  { background: #2a2f3a; color: var(--muted); }

  .addr {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    color: var(--muted);
    max-width: 220px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    display: inline-block;
    vertical-align: middle;
  }

  .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }

  .empty {
    text-align: center;
    padding: 50px 20px;
    color: var(--muted);
  }

  /* Modal */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    align-items: center;
    justify-content: center;
    z-index: 50;
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    width: 480px;
    max-width: 92vw;
    max-height: 88vh;
    overflow-y: auto;
    padding: 22px;
  }
  .modal h2 { margin: 0 0 4px; font-size: 16px; }
  .modal .sub { color: var(--muted); font-size: 12.5px; margin-bottom: 16px; }
  .field { margin-bottom: 12px; }
  .field label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 4px;
    font-weight: 600;
  }
  .field input, .field select, .field textarea {
    width: 100%;
    padding: 8px 10px;
  }
  .field textarea { resize: vertical; min-height: 60px; font-family: inherit; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 18px;
    border-top: 1px solid var(--border);
    padding-top: 14px;
  }
  .error-box {
    background: #3a1616;
    color: #ff9a9a;
    border: 1px solid #5a2020;
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 12.5px;
    margin-bottom: 12px;
    display: none;
    white-space: pre-wrap;
  }
  .toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 13px;
    display: none;
    z-index: 100;
  }
  .toast.show { display: block; }
</style>
</head>
<body>

<header>
  <div>
    <h1>CyArt Source Registry</h1>
    <p>Dark Web Monitoring &amp; Threat Intelligence — crawl target governance</p>
  </div>
  <button class="btn" onclick="openCreateModal()">+ New candidate</button>
</header>

<main>
  <div class="toolbar">
    <select id="f-lifecycle" onchange="load()">
      <option value="">All lifecycle</option>
      <option value="discovered">Discovered</option>
      <option value="validated">Validated</option>
      <option value="authorized">Authorized</option>
      <option value="active">Active</option>
      <option value="quarantined">Quarantined</option>
      <option value="disabled">Disabled</option>
    </select>
    <select id="f-auth" onchange="load()">
      <option value="">All authorization</option>
      <option value="pending">Pending</option>
      <option value="approved">Approved</option>
      <option value="rejected">Rejected</option>
      <option value="expired">Expired</option>
    </select>
    <select id="f-transport" onchange="load()">
      <option value="">All transports</option>
      <option value="clearnet">Clearnet</option>
      <option value="tor">Tor</option>
      <option value="i2p">I2P</option>
    </select>
    <button class="btn secondary small" onclick="resetFilters()">Reset</button>
    <button class="btn secondary small" onclick="load()">Refresh</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Address</th>
        <th>Type</th>
        <th>Transport</th>
        <th>Lifecycle</th>
        <th>Authorization</th>
        <th>Trust</th>
        <th>Enabled</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty" id="empty" style="display:none;">No sources match these filters yet.</div>
</main>

<!-- Create Modal -->
<div class="overlay" id="create-overlay">
  <div class="modal">
    <h2>New candidate source</h2>
    <div class="sub">Always lands as Discovered / Pending — never live.</div>
    <div class="error-box" id="create-error"></div>
    <form id="create-form" onsubmit="submitCreate(event)">
      <div class="field">
        <label>Name</label>
        <input type="text" id="c-name" required maxlength="200" />
      </div>
      <div class="field">
        <label>Address</label>
        <input type="text" id="c-address" required maxlength="500" placeholder="e.g. example.onion or https://example.com" />
      </div>
      <div class="two-col">
        <div class="field">
          <label>Source type</label>
          <select id="c-type">
            <option value="forum">Forum</option>
            <option value="marketplace">Marketplace</option>
            <option value="paste_site">Paste site</option>
            <option value="telegram">Telegram</option>
            <option value="chat_channel">Chat channel</option>
            <option value="index">Index</option>
            <option value="other" selected>Other</option>
          </select>
        </div>
        <div class="field">
          <label>Transport</label>
          <select id="c-transport">
            <option value="clearnet">Clearnet</option>
            <option value="tor">Tor</option>
            <option value="i2p">I2P</option>
          </select>
        </div>
      </div>
      <div class="two-col">
        <div class="field">
          <label>Discovered by</label>
          <input type="text" id="c-discovered-by" />
        </div>
        <div class="field">
          <label>Discovered from</label>
          <input type="text" id="c-discovered-from" />
        </div>
      </div>
      <div class="two-col">
        <div class="field">
          <label>Rate limit (seconds)</label>
          <input type="number" id="c-rate" value="30" min="1" max="3600" />
        </div>
        <div class="field">
          <label>Max depth</label>
          <input type="number" id="c-depth" value="1" min="0" max="10" />
        </div>
      </div>
      <div class="field">
        <label>Allowed paths (comma-separated, optional)</label>
        <input type="text" id="c-paths" />
      </div>
      <div class="modal-actions">
        <button type="button" class="btn secondary" onclick="closeModal('create-overlay')">Cancel</button>
        <button type="submit" class="btn">Submit candidate</button>
      </div>
    </form>
  </div>
</div>

<!-- Authorize Modal -->
<div class="overlay" id="auth-overlay">
  <div class="modal">
    <h2 id="auth-title">Authorization decision</h2>
    <div class="sub" id="auth-sub"></div>
    <div class="error-box" id="auth-error"></div>
    <form id="auth-form" onsubmit="submitAuthorize(event)">
      <input type="hidden" id="a-decision" />
      <div class="field">
        <label>Decided by <span style="color:var(--red)">*</span></label>
        <input type="text" id="a-decided-by" required placeholder="your name or handle" />
      </div>
      <div class="field">
        <label>Basis <span style="color:var(--red)">*</span></label>
        <textarea id="a-basis" required placeholder="Legal / policy justification for this decision"></textarea>
      </div>
      <div class="field">
        <label>Review due (optional)</label>
        <input type="date" id="a-review-due" />
      </div>
      <div class="modal-actions">
        <button type="button" class="btn secondary" onclick="closeModal('auth-overlay')">Cancel</button>
        <button type="submit" class="btn" id="auth-submit-btn">Confirm</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = "/sources";
let sources = [];

const LIFECYCLE_TRANSITIONS = {
  discovered: ["validated", "disabled"],
  validated: ["authorized", "disabled"],
  authorized: ["active", "disabled"],
  active: ["quarantined", "disabled"],
  quarantined: ["active", "disabled"],
  disabled: [],
};

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2800);
}

function resetFilters() {
  document.getElementById("f-lifecycle").value = "";
  document.getElementById("f-auth").value = "";
  document.getElementById("f-transport").value = "";
  load();
}

async function load() {
  const params = new URLSearchParams();
  const lifecycle = document.getElementById("f-lifecycle").value;
  const auth = document.getElementById("f-auth").value;
  const transport = document.getElementById("f-transport").value;
  if (lifecycle) params.set("lifecycle_status", lifecycle);
  if (auth) params.set("authorization_status", auth);
  if (transport) params.set("transport", transport);

  try {
    const res = await fetch(`${API}/?${params.toString()}`);
    if (!res.ok) throw new Error(`Server returned ${res.status}`);
    sources = await res.json();
    render();
  } catch (err) {
    showToast("Failed to load sources: " + err.message);
  }
}

function render() {
  const tbody = document.getElementById("rows");
  const empty = document.getElementById("empty");
  tbody.innerHTML = "";

  if (sources.length === 0) {
    empty.style.display = "block";
    return;
  }
  empty.style.display = "none";

  for (const s of sources) {
    const tr = document.createElement("tr");

    const actions = [];

    if (s.authorization_status === "pending") {
      actions.push(`<button class="btn small" style="background:var(--green)" onclick="openAuthModal('${s.id}','approved')">Approve</button>`);
      actions.push(`<button class="btn small danger" onclick="openAuthModal('${s.id}','rejected')">Reject</button>`);
    }

    const nextStates = LIFECYCLE_TRANSITIONS[s.lifecycle_status] || [];
    if (nextStates.length > 0) {
      const options = nextStates.map(ns => `<option value="${ns}">${cap(ns)}</option>`).join("");
      actions.push(`
        <select class="small" style="padding:5px 6px; font-size:12px;" onchange="if(this.value){transitionLifecycle('${s.id}', this.value); this.value='';}">
          <option value="">Move to…</option>
          ${options}
        </select>
      `);
    }

    actions.push(`<button class="btn small secondary" onclick="toggleEnabled('${s.id}', ${!s.enabled})">${s.enabled ? "Disable" : "Enable"}</button>`);
    actions.push(`<button class="btn small danger" onclick="deleteSource('${s.id}','${escapeAttr(s.name)}')">Delete</button>`);

    tr.innerHTML = `
      <td>${escapeHtml(s.name)}</td>
      <td><span class="addr" title="${escapeAttr(s.address)}">${escapeHtml(s.address)}</span></td>
      <td>${cap(s.source_type)}</td>
      <td>${cap(s.transport)}</td>
      <td><span class="badge ${s.lifecycle_status}">${cap(s.lifecycle_status)}</span></td>
      <td><span class="badge ${s.authorization_status}">${cap(s.authorization_status)}</span></td>
      <td>${s.trust_weight}</td>
      <td>${s.enabled ? "✅" : "—"}</td>
      <td><div class="row-actions">${actions.join("")}</div></td>
    `;
    tbody.appendChild(tr);
  }
}

function cap(str) {
  if (!str) return "";
  return str.replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase());
}
function escapeHtml(str) {
  const d = document.createElement("div");
  d.textContent = str ?? "";
  return d.innerHTML;
}
function escapeAttr(str) {
  return (str ?? "").replace(/'/g, "&#39;").replace(/"/g, "&quot;");
}

/* ---- Create ---- */
function openCreateModal() {
  document.getElementById("create-form").reset();
  document.getElementById("create-error").style.display = "none";
  document.getElementById("create-overlay").classList.add("open");
}
function closeModal(id) {
  document.getElementById(id).classList.remove("open");
}

async function submitCreate(evt) {
  evt.preventDefault();
  const errBox = document.getElementById("create-error");
  errBox.style.display = "none";

  const payload = {
    name: document.getElementById("c-name").value.trim(),
    address: document.getElementById("c-address").value.trim(),
    source_type: document.getElementById("c-type").value,
    transport: document.getElementById("c-transport").value,
    discovered_by: document.getElementById("c-discovered-by").value.trim() || null,
    discovered_from: document.getElementById("c-discovered-from").value.trim() || null,
    rate_limit_seconds: Number(document.getElementById("c-rate").value) || 30,
    max_depth: Number(document.getElementById("c-depth").value) || 0,
    allowed_paths: document.getElementById("c-paths").value.trim() || null,
  };

  try {
    const res = await fetch(`${API}/`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(formatApiError(data));
    closeModal("create-overlay");
    showToast(`"${payload.name}" submitted as Discovered / Pending`);
    load();
  } catch (err) {
    errBox.textContent = err.message;
    errBox.style.display = "block";
  }
}

/* ---- Authorize ---- */
let authTargetId = null;

function openAuthModal(id, decision) {
  authTargetId = id;
  const source = sources.find(s => s.id === id);
  document.getElementById("auth-decision").value = decision;
  document.getElementById("auth-title").textContent =
    decision === "approved" ? "Approve source" : "Reject source";
  document.getElementById("auth-sub").textContent = source ? source.name : "";
  document.getElementById("auth-form").reset();
  document.getElementById("auth-error").style.display = "none";
  const btn = document.getElementById("auth-submit-btn");
  btn.textContent = decision === "approved" ? "Approve" : "Reject";
  btn.style.background = decision === "approved" ? "var(--green)" : "var(--red)";
  document.getElementById("auth-overlay").classList.add("open");
}

async function submitAuthorize(evt) {
  evt.preventDefault();
  const errBox = document.getElementById("auth-error");
  errBox.style.display = "none";

  const reviewDueVal = document.getElementById("a-review-due").value;
  const payload = {
    decision: document.getElementById("auth-decision").value,
    decided_by: document.getElementById("a-decided-by").value.trim(),
    basis: document.getElementById("a-basis").value.trim(),
    review_due: reviewDueVal ? new Date(reviewDueVal).toISOString() : null,
  };

  try {
    const res = await fetch(`${API}/${authTargetId}/authorize`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(formatApiError(data));
    closeModal("auth-overlay");
    showToast(`Decision recorded: ${payload.decision}`);
    load();
  } catch (err) {
    errBox.textContent = err.message;
    errBox.style.display = "block";
  }
}

/* ---- Lifecycle / enable / delete ---- */
async function transitionLifecycle(id, status) {
  try {
    const res = await fetch(`${API}/${id}/lifecycle`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ status }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(formatApiError(data));
    showToast(`Moved to ${cap(status)}`);
    load();
  } catch (err) {
    showToast("Error: " + err.message);
  }
}

async function toggleEnabled(id, enabled) {
  try {
    const res = await fetch(`${API}/${id}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ enabled }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(formatApiError(data));
    showToast(enabled ? "Source enabled" : "Source disabled");
    load();
  } catch (err) {
    showToast("Error: " + err.message);
  }
}

async function deleteSource(id, name) {
  if (!confirm(`Permanently delete "${name}"? This is for test data only — prefer Disable for real sources.`)) return;
  try {
    const res = await fetch(`${API}/${id}`, { method: "DELETE" });
    if (!res.ok && res.status !== 204) {
      const data = await res.json().catch(() => ({}));
      throw new Error(formatApiError(data));
    }
    showToast(`"${name}" deleted`);
    load();
  } catch (err) {
    showToast("Error: " + err.message);
  }
}

function formatApiError(data) {
  if (!data) return "Unknown error";
  if (typeof data.detail === "string") return data.detail;
  if (Array.isArray(data.detail)) {
    return data.detail.map(d => `${(d.loc || []).slice(-1)[0]}: ${d.msg}`).join("\n");
  }
  return JSON.stringify(data);
}

load();
</script>
</body>
</html>
